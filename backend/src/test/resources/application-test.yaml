spring:
  datasource:
    url: jdbc:sqlite:file:memdb1?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
  main:
    web-application-type: servlet
server:
  servlet:
    context-path: /

instakill:
  jwt:
    secret: test-secret-change-me-change-me-change-me-change-me-1234567890
    issuer: instakill-test
    ttl-minutes: 60
media:
  base-path: build/test-media
notification:
  ntfy:
    enabled: false
llm:
  url: ${LOCAL_LLM_URL:http://localhost:12345/v1/chat/completions}
  model: ${LOCAL_LLM_MODEL:google/gemma-3-270m-it}
  timeout-seconds: 5
